<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PR Forge · New personal record</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0C0B}
a{color:#FF7A32}a:hover{color:#FF9A5E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0D0C0B; color: #F6F3EF; font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif; box-sizing: border-box; display: flex; flex-direction: column">

  <section aria-label="New personal record" style="background: {{accent}}; color: #140802; padding: 64px 24px 28px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg>
        New personal record
      </span>
      <a href="Workout.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(20, 8, 2, 0.12); color: #140802; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </a>
    </div>
    <h1 style="margin: 18px 0 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase">Bench Press</h1>
    <p style="margin: 0; display: flex; align-items: baseline; gap: 10px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; line-height: 0.85; font-variant-numeric: tabular-nums">
      <span style="font-size: 132px; letter-spacing: -0.03em">205</span>
      <span style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 30px">lb</span><span style="font-size: 30px">× 5</span></span>
    </p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; margin-top: 14px; border-top: 2px solid #140802">
      <div style="padding: 12px 0 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 30px; line-height: 1">239 lb</span>
        <span style="font-size: 13px; font-weight: 600">Estimated 1-rep max</span>
      </div>
      <div style="padding: 12px 0 0 16px; border-left: 2px solid #140802; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 30px; line-height: 1">+12 lb</span>
        <span style="font-size: 13px; font-weight: 600">Over your best of 227</span>
      </div>
    </div>
  </section>

  <section aria-label="Last 8 sessions" style="padding: 24px 24px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #A8A098">Best set each session</h2>
      <span style="font-size: 13px; color: #A8A098">est. 1RM, lb</span>
    </div>
    <div role="img" aria-label="Estimated one-rep max over the last 8 sessions: 216, 222, 228, 228, 228, 228, 228, then 239 today" style="height: 132px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; align-items: end; border-bottom: 1px solid #2E2A26">
      <span style="height: 40%; border-radius: 4px 4px 0 0; background: #2E2A26"></span>
      <span style="height: 55%; border-radius: 4px 4px 0 0; background: #2E2A26"></span>
      <span style="height: 70%; border-radius: 4px 4px 0 0; background: #3A342F"></span>
      <span style="height: 70%; border-radius: 4px 4px 0 0; background: #3A342F"></span>
      <span style="height: 70%; border-radius: 4px 4px 0 0; background: #3A342F"></span>
      <span style="height: 70%; border-radius: 4px 4px 0 0; background: #3A342F"></span>
      <span style="height: 70%; border-radius: 4px 4px 0 0; background: #3A342F"></span>
      <span style="height: 98%; border-radius: 4px 4px 0 0; background: {{accent}}"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #A8A098"><span>Oct 2</span><span style="color: #F6F3EF; font-weight: 600">Today</span></div>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #D9D3CC">Your first new best in 5 sessions. Bench moves from <strong style="color: #F6F3EF">Holding</strong> to <strong style="color: {{accent}}">Progressing</strong>.</p>
  </section>

  <div style="margin-top: auto; padding: 0 24px 40px; display: flex; flex-direction: column; gap: 10px">
    <a href="Workout.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #F6F3EF; color: #0D0C0B; text-decoration: none; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase">Keep going · rest 1:30</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A32","options":["#FF7A32","#FF5A1F","#FFB020","#5AC8FA"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF7A32' };
  }
}
</script>
</body>
</html>
