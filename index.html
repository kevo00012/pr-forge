<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>window.__prfStart = Date.now();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0C0B">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PR Forge">
  <meta name="description" content="PR Forge — log lifts fast, see progress clearly.">
  <title>PR Forge</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="splash" aria-label="PR Forge is loading">
    <img class="splash-logo" src="icons/logo.png" alt="" onerror="this.remove()">
    <div class="wordmark">PR <span>FORGE</span></div>
    <p class="tagline">Make logging effortless. Make progress obvious.</p>
  </div>
  <div id="app" hidden></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root" hidden></div>
  <noscript>PR Forge needs JavaScript turned on.</noscript>

  <script src="js/units.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
